name: Publish trade board

# Regenerates docs/board.json so GitHub Pages can serve a static board.
# Reads only public, unauthenticated Polymarket data - this workflow needs NO secrets,
# and never touches a Kalshi or Polymarket US account.

on:
  schedule:
    - cron: "*/15 * * * *"    # GitHub often runs these late; treat it as "about every 15m"
  workflow_dispatch:           # lets you refresh on demand from the Actions tab
  push:
    branches: [main]
    paths: [predictionedge/**, .github/workflows/board.yml]

permissions:
  contents: write

concurrency:
  group: publish-board
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: pip install --quiet requests cryptography

      # WalletProfiler caches to data/, which is gitignored and therefore gone on every
      # fresh checkout - so a cache built to make a wallet's FIRST TRADE (an immutable
      # fact, TTL 30 days) a one-time lookup was instead paying a cold fan-out of up to
      # 300 wallets every 15 minutes, and any timeout in it reads downstream as
      # "fresh wallet: age unavailable". Persisting it between runs is what makes the
      # code's own TTL mean anything. Never committed: it is a cache, not a result.
      - name: Restore wallet profile cache
        uses: actions/cache@v4
        with:
          path: data/wallet_profiles.json
          key: wallet-profiles-${{ github.run_id }}
          restore-keys: wallet-profiles-

      - name: Build the board
        env:
          # No .env exists in CI, so the board's settings are declared here.
          # whale_source MUST be polymarket or the provider is a neutral stub
          # and the board comes out silently empty.
          PE_WHALE_SOURCE: polymarket
          PE_RESEARCH_ONLY: "1"
          PE_LIVE_TRADING: "0"
          PE_PMUS_ENABLED: "0"
          PE_OMEN_ACCOUNT_SIZE: "100000"
          PE_OMEN_PER_TRADE_FRACTION: "0.01"
          PE_BOARD_MIN_HOURS: "3"
          PE_BOARD_MAX_DAYS: "30"
          PE_BOARD_MAX_DRIFT_C: "4"
          # The buy bar, and the floor of the probe band recorded below it. This pin used
          # to read 0.35, which was safe only because board_max_tickets=8 truncated behind
          # it. With the cap off, 0.35 IS the board, so it moves up to the real bar.
          PE_BOARD_MIN_CONVICTION: "0.45"
          PE_BOARD_PROBE_MIN_CONVICTION: "0.25"
        run: python -m predictionedge.publish --out docs/board.json

      # The trial lives in docs/ because this job checks out fresh every 15 minutes and
      # .gitignore excludes data/ and *.jsonl - anywhere else and the record would be
      # erased between runs. Committing it here also means each position enters the
      # public log at the moment it was opened, which is the cheapest possible answer to
      # "you could have written that afterwards".
      - name: Record and settle the paper trial
        env:
          PE_FEE_MULTIPLIER: "0.07"
        run: python -m predictionedge.papertrial --board docs/board.json --trial docs/trial.json

      # Logs EVERY city-day the weather model looked at, not just the ones it bet on.
      # The trial only ever records disagreements, so a forecast bias fitted from it
      # would measure the error conditional on having disagreed - the same selection
      # trap as judging a stock screen by the stocks it bought. This is the unbiased
      # sample, and it is what eventually replaces the guessed sigma in weather.py.
      - name: Log weather forecasts and resolve past days
        run: python -m predictionedge.weatherlog --log docs/wxlog.json

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/board.json docs/trial.json docs/wxlog.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "board: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # A dropped push used to cost one stale board; it now costs paper positions
          # that can never be re-opened at the price we saw. Rebase and retry.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $i failed; retrying"
            sleep 5
          done
          exit 1
